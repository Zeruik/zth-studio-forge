name: Windows candidate acceptance
on:
  push:
    branches: ['release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked development dependencies
        run: npm ci --prefix build-runtime --no-audit --no-fund
      - name: Install checksum-pinned official Inno Setup 7.1.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $setup
          # SHA-256 from the official release's accompanying .issig metadata.
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0') { throw 'Inno Setup checksum mismatch' }
          if ((Get-AuthenticodeSignature $setup).Status -ne 'Valid') { throw 'Inno Setup Authenticode verification failed' }
          $compiler = Join-Path $env:RUNNER_TEMP 'inno-7.1.1'
          $process = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $compiler + '"')) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
          $iscc = Join-Path $compiler 'ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler missing' }
          "ZTH_ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Build, launch, reopen and verify the production payload
        run: node ci-windows.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-win32-x64-${{ github.sha }}
          path: |
            out/release/*.zip
            out/release/*.zip.sha256
            ci-proof/win32-x64.json
          if-no-files-found: error
          retention-days: 7
